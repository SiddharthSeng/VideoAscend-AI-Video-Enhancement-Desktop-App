name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install icon generation deps
        run: npm install --save-dev png-to-ico png2icons icns-lib
        continue-on-error: true

      - name: Generate icons
        run: node scripts/create-icon.js
        continue-on-error: true

      - name: Ensure fallback icons exist
        shell: pwsh
        run: |
          $icons = @("assets/icon.png", "assets/icon.ico", "assets/icon.icns")
          foreach ($icon in $icons) {
            if (!(Test-Path $icon)) {
              Copy-Item "assets/icon.png" $icon -ErrorAction SilentlyContinue
              echo "Created fallback: $icon"
            } else {
              echo "OK: $icon"
            }
          }

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w sharp
        continue-on-error: true

      - name: Build Windows
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
          USE_HARD_LINKS: 'false'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install icon generation deps
        run: npm install --save-dev png-to-ico png2icons icns-lib
        continue-on-error: true

      - name: Generate icons
        run: node scripts/create-icon.js
        continue-on-error: true

      - name: Ensure fallback icons exist
        run: |
          [ ! -f assets/icon.ico ] && cp assets/icon.png assets/icon.ico
          [ ! -f assets/icon.icns ] && cp assets/icon.png assets/icon.icns
          ls -lh assets/icon*

      - name: Build macOS
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
          USE_HARD_LINKS: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          # Core electron runtime deps
          sudo apt-get install -y \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            libgbm1 \
            libxkbcommon0 \
            xvfb \
            rpm \
            fakeroot \
            dpkg \
          || true
          # libasound — name differs between Ubuntu versions
          sudo apt-get install -y libasound2t64 2>/dev/null \
            || sudo apt-get install -y libasound2 2>/dev/null \
            || echo "libasound skipped — not critical"
          # Build tools needed for native modules
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            libx11-dev \
            libxext-dev \
          || true

      - name: Install dependencies
        run: npm ci

      - name: Install icon generation deps
        run: npm install --save-dev png-to-ico png2icons icns-lib
        continue-on-error: true

      - name: Generate icons
        run: node scripts/create-icon.js
        continue-on-error: true

      - name: Ensure fallback icons exist
        run: |
          [ ! -f assets/icon.ico ] && \
            cp assets/icon.png assets/icon.ico && \
            echo "Created fallback icon.ico"
          [ ! -f assets/icon.icns ] && \
            cp assets/icon.png assets/icon.icns && \
            echo "Created fallback icon.icns"
          echo "Icons present:"
          ls -lh assets/icon*

      - name: Rebuild sharp for Linux
        run: |
          cd node_modules/sharp && npm rebuild
        continue-on-error: true

      - name: Build Linux (with virtual display)
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
          USE_HARD_LINKS: 'false'
          DEBUG: 'electron-builder'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: warn


  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: List release files
        run: find release-files -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VideoAscend ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## VideoAscend ${{ github.ref_name }}

            ### Download for your platform

            | Platform | File |
            |---|---|
            | Windows installer | `VideoAscend-*-Setup.exe` |
            | Windows portable | `VideoAscend-*-Portable.exe` |
            | macOS Intel | `VideoAscend-*-mac-x64.dmg` |
            | macOS Apple Silicon | `VideoAscend-*-mac-arm64.dmg` |
            | Linux AppImage | `VideoAscend-*-x86_64.AppImage` |
            | Linux deb | `VideoAscend-*-amd64.deb` |

            > **macOS:** Right-click the app → Open on first launch.
            > **Linux AppImage:** Run chmod +x *.AppImage first.

          files: |
            release-files/**/*.exe
            release-files/**/*.dmg
            release-files/**/*.zip
            release-files/**/*.AppImage
            release-files/**/*.deb
            release-files/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

appId: org.videoascend.app
productName: VideoAscend
copyright: Copyright © 2025 VideoAscend
directories:
  output: release
  buildResources: assets

# Prevent electron-builder from failing on optional native deps
npmRebuild: false
buildDependenciesFromSource: false

# Ensure asar includes necessary files
asar: true
asarUnpack:
  - "node_modules/sharp/**"
  - "node_modules/ffmpeg-static/**"
  - "node_modules/@ffprobe-installer/**"

files:
  - dist/**/*
  - electron/**/*
  - "!node_modules/**/*"

extraResources:
  - from: node_modules/ffmpeg-static
    to: ffmpeg-static
    filter:
      - "**/*"
  - from: node_modules/@ffprobe-installer
    to: ffprobe-installer
    filter:
      - "**/*"

# macOS — no code signing
mac:
  category: public.app-category.video
  icon: assets/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  sign: false
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64, ia32]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VideoAscend

# Linux
linux:
  icon: assets/icon.png
  category: Video
  maintainer: VideoAscend <support@videoascend.app>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]

deb:
  packageCategory: video
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1

publish:
  provider: github
  owner: SiddharthSeng
  repo: VideoAscend-AI-Video-Enhancement-Desktop-App
  releaseType: release
